services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports:
      - "5432:5432"
    volumes:
      - waypoint-db-data:/var/lib/postgresql/data

volumes:
  waypoint-db-data:
